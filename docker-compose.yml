# Con Connect — entorno local reproducible (§7.0)
#
# `docker compose up` levanta PostgreSQL, la API y el frontend.
# El proyecto arranca SIN ninguna credencial externa (§7.0).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: connect
      POSTGRES_USER: connect
      POSTGRES_PASSWORD: connect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `depends_on: service_healthy` no espera a que PostgreSQL acepte
      # conexiones si no hay healthcheck: espera a que el contenedor exista.
      test: ["CMD-SHELL", "pg_isready -U connect -d connect"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://connect:connect@db:5432/connect
      # Clave de desarrollo. En producción es obligatoria y única (spec 001 R-003).
      SECRET_KEY: connect-local-development-key-not-a-secret
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # El contenido de los juegos se monta de solo lectura: los tests de
      # integridad lo necesitan y no tiene sentido que el contenedor pueda
      # escribir en el contenido del MVP (§2.1.3).
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      # El cliente llama a la API a través del proxy de Vite, para que en
      # desarrollo no haya CORS ni doble configuración (§2.5).
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
      # El mismo montaje de solo lectura que tiene el backend: los recorridos E2E
      # (spec 008) leen `data/seed_v0.sql` para saber qué palabras y respuestas
      # hay, que es lo único que el servidor no devuelve (§2.1.2). Está fuera del
      # contexto de build y fuera de `src/`, así que no llega al bundle.
      - ./data:/data:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  # Volumen anónimo para node_modules: si se montara el node_modules del host
  # (arm64 de macOS) sobre Linux, los binarios nativos no funcionarían.
  frontend_modules: