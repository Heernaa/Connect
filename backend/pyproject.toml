[project]
name = "connect-backend"
version = "0.1.0"
description = "API de Connect: validación y puntuación en el servidor (§2.1.6)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    # argon2id para hashear contraseñas. Se hashean, nunca se cifran (§6.2).
    "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    # `httpx2` es `httpx` renombrado: es lo que el cliente de pruebas de
    # starlette 1.8 importa. La biblioteca es la misma que fija la constitución
    # §5; en esta versión el paquete cambió de nombre.
    "httpx2>=2.9,<3.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: necesita PostgreSQL en marcha"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# B008: en FastAPI, `Depends(...)` en el valor por defecto de un parámetro es la
# forma de declarar una dependencia. Es el idioma del framework, no un error.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las genera Alembic, no se escriben a mano. Reformatearlas
# haría que la siguiente autogenerada volviera a salir distinta, así que se
# dejan como están.
"alembic/versions/*" = ["E501", "I001"]